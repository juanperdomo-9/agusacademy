<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Álbum de Figuritas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;background:#cfcfcc;overflow:hidden;font-family:"Arial Narrow",Arial,sans-serif;color:#000}
.album{position:absolute;left:40px;top:40px;width:1360px;height:820px;background:#fff;display:grid;grid-template-columns:1fr 1fr}
.gutter{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#000;opacity:.25;z-index:3}
.page{position:relative;padding:36px}
.hdr{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.sticker{position:absolute;left:300px;top:80px;width:480px;height:640px;background:#fff;padding:14px;transform:rotate(-2.5deg);box-shadow:0 2px 0 #000,0 18px 40px rgba(0,0,0,.25);z-index:2}
.sticker .ph{width:100%;height:540px;background:radial-gradient(ellipse 55% 50% at 50% 42%,#cfcfcf 0,#555 50%,#0b0b0b 85%)}
.sticker .nm{display:flex;justify-content:space-between;align-items:end;margin-top:12px;font-weight:900;font-size:30px;font-stretch:condensed}
.sticker .nm b{font-size:56px;line-height:.8}
.peel{position:absolute;right:0;bottom:0;width:60px;height:60px;background:linear-gradient(135deg,#fff 50%,#d6d6d6 50%)}
h1{position:absolute;right:36px;top:90px;width:520px;font-size:96px;line-height:.86;font-weight:900;font-stretch:condensed;text-transform:uppercase;text-align:right}
.slots{position:absolute;right:36px;top:410px;width:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{height:120px;border:1.5px dashed #000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:40px;font-stretch:condensed}
.foot{position:absolute;right:36px;bottom:36px;width:560px;display:flex;align-items:end;justify-content:space-between}
.cnt{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.cnt b{display:block;font-size:44px;font-weight:900;font-stretch:condensed;letter-spacing:0}
.cta{background:#000;color:#fff;font-weight:900;font-size:24px;padding:22px 34px;text-transform:uppercase}
</style></head><body>
<div class="album"><div class="gutter"></div>
 <div class="page"><div class="hdr"><span>Agus Martin Academy</span><span>Pág. 01</span></div></div>
 <div class="page"><div class="hdr"><span>Curso de barbería</span><span>Pág. 02</span></div>
  <h1>Completá el álbum. Salí barbero.</h1>
  <div class="slots"><div class="slot">01</div><div class="slot">02</div><div class="slot">03</div><div class="slot">04</div><div class="slot">05</div><div class="slot">06</div></div>
  <div class="foot"><div class="cnt">El sobre de lanzamiento cierra en<b>02 : 14 : 37 : 09</b></div><a class="cta">Quiero mi álbum</a></div>
 </div>
 <div class="sticker"><div class="ph"></div><div class="nm"><span>AGUS MARTIN<br><small style="font-size:14px;letter-spacing:.12em">BARBERO · DOCENTE</small></span><b>00</b></div><div class="peel"></div></div>
</div>
</body></html>
