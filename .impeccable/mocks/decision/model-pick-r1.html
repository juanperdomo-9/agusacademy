<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Escala de Peine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;background:#000;color:#fff;overflow:hidden;font-family:"Arial Narrow",Arial,sans-serif}
.vid{position:absolute;inset:0;background:radial-gradient(ellipse 35% 55% at 64% 45%,#9a9a9a 0,#3b3b3b 45%,#000 80%)}
.num{position:absolute;right:-30px;top:-80px;font-weight:900;font-stretch:condensed;font-size:900px;line-height:.8;color:transparent;-webkit-text-stroke:2px #fff;letter-spacing:-.04em}
.nav{position:absolute;left:40px;right:40px;top:28px;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.ramp{position:absolute;left:40px;top:90px;display:flex;flex-direction:column;gap:4px;font-size:13px;letter-spacing:.1em}
.ramp i{display:inline-block;width:28px;height:10px;margin-right:10px;vertical-align:middle}
h1{position:absolute;left:40px;bottom:200px;width:760px;font-size:120px;line-height:.86;font-weight:900;font-stretch:condensed;text-transform:uppercase}
.row{position:absolute;left:40px;bottom:48px;display:flex;gap:40px;align-items:end}
.cnt{font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.cnt b{display:block;font-size:48px;font-weight:900;font-stretch:condensed;letter-spacing:0}
.cta{background:#fff;color:#000;font-weight:900;font-size:24px;padding:24px 40px;text-transform:uppercase}
</style></head><body>
<div class="vid"></div><div class="num">#0</div>
<div class="nav"><span>Agus Martin Academy</span><span>Curso online</span></div>
<div class="ramp"><span><i style="background:#000;outline:1px solid #fff"></i>#0</span><span><i style="background:#262626"></i>#0.5</span><span><i style="background:#4d4d4d"></i>#1</span><span><i style="background:#808080"></i>#1.5</span><span><i style="background:#b3b3b3"></i>#2</span><span><i style="background:#fff"></i>#3</span></div>
<h1>Del cero<br>al fade perfecto</h1>
<div class="row"><div class="cnt">Precio de lanzamiento termina en<b>02 : 14 : 37 : 09</b></div><a class="cta">Quiero entrar</a></div>
</body></html>
